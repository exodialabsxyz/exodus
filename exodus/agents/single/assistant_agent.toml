[agent]
name = "assistant_agent"
description = "General-purpose cybersecurity assistant for various tasks and coordination"
system_prompt = ["common.md", "session.md", "assistant_agent.md"]

tools = [
    "shell",
    "wait",
]

handoffs = [
    "recon_agent",
    "triage_agent",
    "exploit_agent",
    "web_exploit_agent",
    "privesc_agent",
]

[agent.llm]
temperature = 0.7
max_context_tokens = 700000
